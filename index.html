<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodoči Ati</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            text-align: center;
        }

        .container {
            padding: 50px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        img {
            margin-top: 30px;
            width: 250px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card {
            margin-top: 40px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #2575fc;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bodoči Ati</h1>
        <div class="subtitle">Blaž Kos</div>

        <img src="slika.jpg" alt="Slika">

        <div class="card">
            <p>Nova življenjska avantura se začenja 👶</p>
            <button onclick="alert('Čestitke! 🎉')">Klikni me</button>
        </div>
    </div>

</body>
</html>
